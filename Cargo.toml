[package]
name = "netwatch-desktop"
version = "0.1.1"
edition = "2021"
# netwatch-tui 0.35.1 declares no rust-version, but it calls
# AtomicUsize::try_update (stable in 1.95) on every platform and
# File::try_lock (1.89) on unix. clippy's incompatible_msrv lint checks only
# this crate's own code against this, not its dependencies; CI's msrv job
# builds everything with 1.95.
rust-version = "1.95"
authors = ["Matt Hartley <matthew.t.hartley@gmail.com>"]
description = "See which programs on this computer use the network and what's wrong with it. A desktop app built on netwatch."
license = "MIT"
repository = "https://github.com/matthart1983/netwatch-desktop"
homepage = "https://github.com/matthart1983/netwatch-desktop"
readme = "README.md"
keywords = ["network-monitor", "netwatch", "egui", "packet-capture", "diagnostics"]
categories = ["network-programming", "gui", "visualization"]
# The screenshots are for the repository's README, about 2 MB; crates.io
# shows README images from the repository.
exclude = ["docs/screenshots/", ".github/"]

[[bin]]
name = "netwatch-desktop"
path = "src/main.rs"

[dependencies]
# Reuses netwatch's collectors/health/config modules directly instead of
# reimplementing socket enumeration, RTT probing, or gateway/DNS detection.
# `default-features = false` skips the eBPF attribution path (netwatch-sdk +
# aya) — desktop MVP runs on the same lsof/procfs fallback the TUI uses when
# eBPF is unavailable, avoiding a kernel-capability dependency for a first
# build. Pinned exactly: netwatch's library API changes between minor
# releases, so moving to a new version is a deliberate port.
netwatch = { package = "netwatch-tui", version = "=0.35.1", default-features = false }
eframe = "0.28"
egui = { version = "0.28", features = ["bytemuck"] }
# Share Netwatch's existing graph magnitude ramp; no second palette algorithm.
ratatui = { version = "0.27", default-features = false }
# Native screenshot captures for repeatable visual checks.
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
# Desktop layout persistence and export timestamps; already in the lockfile via netwatch.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
dirs = "5"
chrono = "0.4"

[dev-dependencies]
# The screenshot fixture moves netwatch's demo incident into documentation
# address ranges by rewriting it as JSON. Already in the lockfile via netwatch.
serde_json = "1"
